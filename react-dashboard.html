<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>

<div class="navbar">
    <span class="navbar-brand">🤸 Gymnastics Academy</span>
    <div class="navbar-links">
        <a href="php/admin.php">Back to Admin</a>
    </div>
</div>

<div id="root"></div>

<script type="text/babel">

function GymnastRow({ gymnast, onDelete }) {
    return (
        <tr>
            <td>{gymnast.full_name}</td>
            <td>{gymnast.membership_id}</td>
            <td>{gymnast.training_program}</td>
            <td>{gymnast.enrollment_date}</td>
            <td>
                <span className={`badge badge-${gymnast.status.toLowerCase().replace(' ', '')}`}>
                    {gymnast.status}
                </span>
            </td>
            <td>
                <button
                    className="btn btn-danger btn-sm"
                    onClick={() => onDelete(gymnast.id)}>
                    Delete
                </button>
            </td>
        </tr>
    );
}

// Main Dashboard
function Dashboard() {

    const [gymnasts, setGymnasts] = React.useState([]);

    const [search, setSearch] = React.useState('');

    const [filterProgram, setFilterProgram] = React.useState('');

React.useEffect(() => {
    fetch('http://localhost:3000/api/gymnasts')
        .then(function(response) {
            return response.json();
        })
        .then(function(data) {
            setGymnasts(data);
            console.log('Fetched from Node.js API:', data);
        })
        .catch(function(err) {
            console.log('Could not connect to API:', err);
        });
}, []);

    function handleDelete(id) {
        if (window.confirm('Are you sure you want to delete this gymnast?')) {
            setGymnasts(gymnasts.filter(g => g.id !== id));
        }
    }

    const filtered = gymnasts.filter(g => {
        const matchesSearch = g.full_name.toLowerCase().includes(search.toLowerCase()) ||
                              g.membership_id.toLowerCase().includes(search.toLowerCase());
        const matchesProgram = filterProgram === '' || g.training_program === filterProgram;
        return matchesSearch && matchesProgram;
    });

    return (
        <div className="container">
            <h2 className="page-heading">React Dashboard</h2>

            <div className="filter-bar">
                <input
                    type="text"
                    placeholder="Search by name or ID..."
                    value={search}
                    onChange={e => setSearch(e.target.value)}
                />
                <select
                    value={filterProgram}
                    onChange={e => setFilterProgram(e.target.value)}>
                    <option value="">All Programs</option>
                    <option value="Beginner">Beginner</option>
                    <option value="Intermediate">Intermediate</option>
                    <option value="Advanced">Advanced</option>
                </select>
            </div>


            <div className="table-card">
                <table>
                    <thead>
                        <tr>
                            <th>Full Name</th>
                            <th>Membership ID</th>
                            <th>Program</th>
                            <th>Enrollment Date</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {filtered.length > 0 ? (
                            filtered.map(g => (
                                <GymnastRow
                                    key={g.id}
                                    gymnast={g}
                                    onDelete={handleDelete}
                                />
                            ))
                        ) : (
                            <tr>
                                <td colSpan="6" className="text-center text-muted">
                                    No gymnasts found.
                                </td>
                            </tr>
                        )}
                    </tbody>
                </table>
            </div>

            <p className="text-muted mt-1">
                Showing {filtered.length} of {gymnasts.length} gymnasts
            </p>
        </div>
    );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Dashboard />);

</script>

</body>
</html>
